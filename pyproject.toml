[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fa-fave-downloader"
version = "0.1.0"
description = "A tool to download your favorites from Fur Affinity"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0"
]
authors = [
    {name = "Lex", email = "daxxcat@icloud.com"},
]
maintainers = [
    {name = "Lex", email = "daxxcat@icloud.com"},
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/fa-fave-downloader"
Repository = "https://github.com/yourusername/fa-fave-downloader"
Issues = "https://github.com/yourusername/fa-fave-downloader/issues"

[project.scripts]
fa-fave-downloader = "fa_fave_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fa_fave_downloader = ["*.txt", "*.md"]
